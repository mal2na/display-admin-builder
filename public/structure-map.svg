<text class="tm t4" x="88" y="610">혜택 홈, 쇼핑 홈</text>
<text class="sep" x="244" y="592" text-anchor="middle">›</text>

<rect class="bx-lv" x="256" y="540" width="160" height="88" rx="8"/>
