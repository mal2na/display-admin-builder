<svg viewBox="0 0 1260 950" xmlns="http://www.w3.org/2000/svg">
<style>
  text{font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  .tx{fill:#1b2230}.tm{fill:#44505f}.ta{fill:#3b3fd8}
  .t1{font-size:17px;font-weight:700}.t2{font-size:15px;font-weight:700}.t3{font-size:12.5px}.t4{font-size:12px}.tier{font-size:15px;font-weight:800}
  .flbl{paint-order:stroke;stroke:#ffffff;stroke-width:3.5;stroke-linejoin:round}
  .z-ext{fill:#eceef2;stroke:#cfd5df;stroke-dasharray:6 5}
  .z-adm{fill:none;stroke:#3b3fd8;stroke-width:1.5}
  .bx-ext{fill:#ffffff;stroke:#cfd5df;stroke-dasharray:5 4}
  .bx{fill:#ffffff;stroke:#cfd5df}
  .bx-main{fill:#eceefe;stroke:#3b3fd8;stroke-width:1.5}
  .bx-build{fill:#ffffff;stroke:#3b3fd8}
  .bx-lv{fill:#dfe1fd;stroke:#3b3fd8}
  .bx-sub{fill:#eceef2;stroke:#cfd5df;stroke-dasharray:5 4}
  .ar{fill:none;stroke:#44505f;stroke-width:2}
  .ar-a{fill:none;stroke:#3b3fd8;stroke-width:2}
  .ar-opt{fill:none;stroke:#44505f;stroke-width:2;stroke-dasharray:6 5}
  .chip-opt{fill:#ffffff;stroke:#44505f;stroke-dasharray:3 3}
  .opt-tag{fill:#eceef2;stroke:#44505f;stroke-dasharray:3 3}
  .num{fill:#3b3fd8}.numt{fill:#ffffff;font-size:11px;font-weight:600}
  .sep{fill:#3b3fd8;font-size:22px;font-weight:700}
  .lbl-bg{fill:#ffffff}
</style>
<rect x="0" y="0" width="1260" height="950" fill="#ffffff"/>
<defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#44505f"/></marker>
  <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b3fd8"/></marker>
  <marker id="ms" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#44505f"/></marker>
</defs>

<rect class="z-ext" x="20" y="20" width="1220" height="140" rx="12"/>
<text class="tx tier" x="44" y="76">외부 시스템</text>
