<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B안 통합 v3 · 전체 페이지·메뉴 관리</title>
<style>
  /* Layout: 기존 A·B안 어드민 셸(LNB + 카드) 그대로 · 한 메뉴 안에서 목록 보기 / 메뉴 트리 보기 전환 */
  :root {
    --bg: #eef0f6; --surface: #fff; --surface-2: #f6f7fb; --head: #f3f4f8; --hover: #fafbff; --sel: #fffbe8; --new: #f1fff5;
    --line: #e3e5ee; --line-2: #d3d6e2;
    --ink: #1f2330; --ink-2: #4b5060; --ink-3: #8a8fa3; --on-acc: #fff;
    --accent: #3b2bd9; --accent-2: #3224bd; --accent-soft: #eceafc; --accent-line: #c9c3f5;
    --ok: #2f7f4f; --ok-soft: #e6f5ea; --warn: #d9534f; --warn-soft: #fdeaea; --amber: #c77700; --amber-soft: #fff3e0; --amber-line: #f3d9a8;
    --blue: #2f5fd0; --blue-soft: #e8effc; --d2: #3a6fd8; --d3: #2f9c6a; --toast: #1f2330;
    --shadow: 0 1px 2px rgba(20,24,40,.06), 0 8px 24px rgba(20,24,40,.06); --shadow-lg: 0 12px 40px rgba(20,24,40,.18);
    --f-body: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --f-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #14161d; --surface: #1c1f28; --surface-2: #232733; --head: #262a37; --hover: #232838; --sel: #3a3420; --new: #1c2f24;
    --line: #2f3443; --line-2: #3d4356; --ink: #e8eaf1; --ink-2: #b6bbca; --ink-3: #828899; --on-acc: #fff;
    --accent: #8f84ff; --accent-2: #a49bff; --accent-soft: #29264a; --accent-line: #4a4380;
    --ok: #6fcf97; --ok-soft: #1c2f24; --warn: #f08a85; --warn-soft: #3a2222; --amber: #f2b35c; --amber-soft: #33291a; --amber-line: #5a4426;
    --blue: #8fb0ff; --blue-soft: #1f2a44; --d2: #8fb0ff; --d3: #6fcf97; --toast: #000;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 12px 40px rgba(0,0,0,.5); color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #14161d; --surface: #1c1f28; --surface-2: #232733; --head: #262a37; --hover: #232838; --sel: #3a3420; --new: #1c2f24;
    --line: #2f3443; --line-2: #3d4356; --ink: #e8eaf1; --ink-2: #b6bbca; --ink-3: #828899; --on-acc: #fff;
    --accent: #8f84ff; --accent-2: #a49bff; --accent-soft: #29264a; --accent-line: #4a4380;
    --ok: #6fcf97; --ok-soft: #1c2f24; --warn: #f08a85; --warn-soft: #3a2222; --amber: #f2b35c; --amber-soft: #33291a; --amber-line: #5a4426;
    --blue: #8fb0ff; --blue-soft: #1f2a44; --d2: #8fb0ff; --d3: #6fcf97; --toast: #000;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 12px 40px rgba(0,0,0,.5); color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 var(--f-body); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { display: flex; min-height: 100vh; }
  .lnb { width: 220px; flex: none; background: var(--surface); border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 6px; }
  .lnb .logo { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #9d8cff, #4d3ee6 60%, #2a1fb0); box-shadow: 0 0 0 4px var(--accent-soft); margin: 4px 0 26px 8px; }
  .lnb .grp { font-size: 11.5px; font-weight: 700; color: var(--ink-3); padding: 8px 10px 4px; letter-spacing: .02em; }
  .lnb a { display: block; padding: 9px 12px; border-radius: 8px; font-size: 13px; color: var(--ink-2); text-decoration: none; cursor: pointer; }
  .lnb a:hover { background: var(--surface-2); }
  .lnb a.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .lnb a.off { color: var(--ink-3); cursor: default; } .lnb a.off:hover { background: none; }
  .lnb .gone { margin-top: 2px; padding: 6px 12px; font-size: 11.5px; color: var(--ink-3); text-decoration: line-through; }
  .main { flex: 1; padding: 18px 18px 18px 6px; min-width: 0; }
  .card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 40px 36px 36px; min-height: calc(100vh - 36px); min-width: 0; }
  @media (max-width: 900px) { .lnb { display: none; } .main { padding: 10px 16px; } .card { padding: 24px 16px; } }
  .crumb { font-size: 11.5px; color: var(--ink-3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .crumb .cur { color: var(--ink-2); }
  .hrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; font-weight: 700; margin: 8px 0 18px; text-wrap: balance; }
  .rule { height: 1px; background: var(--line); margin-bottom: 22px; }
  .spacer { flex: 1; }

  .views { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; padding: 3px; background: var(--surface-2); gap: 2px; }
  .views button { border: 0; background: none; padding: 7px 16px; border-radius: 7px; font-weight: 600; color: var(--ink-2); cursor: pointer; font-size: 12.5px; }
  .views button.on { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
  .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
  .tab { padding: 10px 16px; border: 0; background: none; color: var(--ink-3); font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

  .note { background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 18px; line-height: 1.65; }
  .note b { color: var(--ink); }
  .banner { display: flex; align-items: center; gap: 12px; background: var(--amber-soft); border: 1px solid var(--amber-line); border-radius: 10px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 14px; flex-wrap: wrap; }

  .searchbar { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin-bottom: 18px; }
  .searchbar label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  select, input[type="text"] { border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); padding: 6px 10px; font-size: 12.5px; min-height: 32px; max-width: 100%; }
  input:disabled { background: var(--surface-2); color: var(--ink-3); }
  .chip-f { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .chip-f.on { background: var(--accent); color: var(--on-acc); border-color: var(--accent); }
  .btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 6px; padding: 7px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.pill { border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 500; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-acc); }
  .btn.primary:hover { background: var(--accent-2); }
  .btn.dark { border-color: var(--ink); }
  .btn.sm { padding: 4px 10px; font-size: 11.5px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.warnb { color: var(--warn); }

  .rmeta { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 10px; flex-wrap: wrap; }
  .rmeta .n { color: var(--accent); font-weight: 600; }
  .tblwrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th { background: var(--head); font-size: 12px; font-weight: 700; padding: 11px 10px; text-align: left; white-space: nowrap; color: var(--ink-2); }
  tbody td { padding: 11px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; vertical-align: middle; }
  .nw { white-space: nowrap; } .ct { text-align: center; }
  tbody tr.rowlink { cursor: pointer; }
  tbody tr.rowlink:hover td { background: var(--hover); }
  tbody tr.dim td { color: var(--ink-3); }
  .mono { font-family: var(--f-mono); font-size: 12px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; border: 1px solid var(--line-2); color: var(--ink-2); background: var(--surface); white-space: nowrap; }
  .tag.ch { color: var(--accent); border-color: var(--accent-line); border-radius: 999px; }
  .tag.gray { background: var(--surface-2); border-color: transparent; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .tag.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .tag.amber { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
  .tag.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .tag.blue { background: var(--blue-soft); color: var(--blue); border-color: transparent; }
  .tag.none { background: var(--surface); border: 1px dashed var(--line-2); color: var(--ink-3); }
  .tag.src { font-size: 10.5px; padding: 1px 6px; }
  .tag.src.b { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .hint { font-size: 11.5px; color: var(--ink-3); }
  .hint.warn { color: var(--warn); } .hint.acc { color: var(--accent); } .hint.amb { color: var(--amber); }
  .lnk { color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 12.5px; }
  .pager { display: flex; justify-content: center; gap: 4px; margin: 18px 0; font-size: 12px; }
  .pager button { border: 0; background: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; color: var(--ink-2); }
  .pager button.on { background: var(--accent); color: var(--on-acc); }
  .actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; flex-wrap: wrap; align-items: center; }

  /* 스위치 */
  .sw { position: relative; display: inline-block; width: 34px; height: 19px; flex: none; cursor: pointer; vertical-align: middle; }
  .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
  .sw span { position: absolute; inset: 0; background: var(--line-2); border-radius: 999px; transition: background .15s; }
  .sw span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 15px; height: 15px; background: var(--surface); border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .sw input:checked + span { background: var(--accent); }
  .sw input:checked + span::after { transform: translateX(15px); }
  .sw input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sw.dis { cursor: not-allowed; } .sw.dis span { background: var(--surface-2); border: 1px dashed var(--line-2); }
  .mcell { display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .swr { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; } .swr.warn { color: var(--warn); } .swr.amb { color: var(--amber); }

  /* 트리 보기 */
  .twocol { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
  @media (max-width: 1180px) { .twocol { grid-template-columns: minmax(0, 1fr); } }
  .tree { min-width: 0; overflow-x: auto; }
  .trow, .thead { display: grid; grid-template-columns: minmax(240px, 1fr) 70px 150px 104px; align-items: center; min-width: 600px; }
  .thead { background: var(--head); font-size: 12px; font-weight: 700; color: var(--ink-2); padding: 11px 10px; }
  .thead .c, .trow .c { text-align: center; }
  .trow { border-bottom: 1px solid var(--line); padding: 9px 10px; font-size: 12.5px; cursor: pointer; }
  .trow:hover { background: var(--hover); }
  .trow.sel { background: var(--sel); }
  .trow.beyond { color: var(--ink-3); }
  .trow.dimrow { color: var(--ink-3); }
  .trow.newpl { background: var(--new); } .trow.newpl.sel { background: var(--sel); }
  .trow.focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .trow.dragging { opacity: .4; } .trow.over-top { box-shadow: inset 0 3px 0 var(--accent); } .trow.over-bot { box-shadow: inset 0 -3px 0 var(--accent); }
  .trow.over-in { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); } .trow.over-no { background: var(--warn-soft); cursor: not-allowed; }
  .nmcell { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .nmcell .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .guides { display: inline-flex; flex: none; align-self: stretch; margin: -9px 0; }
  .guides i { width: 16px; border-left: 1px solid var(--line); margin-left: 7px; margin-right: -8px; }
  .guides i:first-child { margin-left: 0; }
  .guides i.edge { border-left: 2px solid var(--accent-line); }
  .chev { width: 14px; text-align: center; flex: none; font-size: 10px; color: var(--ink-3); cursor: pointer; }
  .chev.ph { cursor: default; }
  .grip { color: var(--line-2); letter-spacing: -2px; font-size: 14px; cursor: grab; margin-right: 2px; }
  .dp { display: inline-block; flex: none; min-width: 24px; text-align: center; font-size: 10px; font-weight: 700; border-radius: 4px; padding: 1px 4px; background: var(--accent-soft); color: var(--accent); margin-right: 4px; }
  .dp.out { background: var(--surface-2); color: var(--ink-3); }
  .dropzone { border: 2px dashed var(--line-2); border-radius: 8px; padding: 10px; text-align: center; color: var(--ink-3); font-size: 12px; margin-bottom: 8px; }
  .dropzone.over-in { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .legend { display: flex; gap: 16px; align-items: center; font-size: 11.5px; color: var(--ink-2); padding: 0 2px 8px; flex-wrap: wrap; }
  .legend .lg { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .legend .lg.in { background: var(--accent-soft); border: 1px solid var(--accent-line); } .legend .lg.out { background: var(--surface-2); border: 1px solid var(--line-2); }
  .ttool { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .lv { width: 26px; height: 26px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 5px; font-size: 11.5px; font-weight: 600; cursor: pointer; color: var(--ink-2); padding: 0; }
  .lv.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .pane { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow); min-width: 0; }
  .ph { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .ph h3 { margin: 0; font-size: 14px; }
  .pane .x { border: 0; background: none; font-size: 18px; cursor: pointer; color: var(--ink-3); }
  .pane h4 { font-size: 12.5px; margin: 14px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); }
  .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; padding: 5px 0; }
  .kv .k { color: var(--ink-2); flex: none; } .kv .v { color: var(--ink-3); text-align: right; min-width: 0; word-break: keep-all; }
  .prow { display: grid; grid-template-columns: 74px 1fr; gap: 8px; align-items: start; padding: 7px 0; font-size: 12.5px; }
  .prow .k { color: var(--ink-2); font-weight: 600; padding-top: 4px; }
  .prow input[type=text] { width: 100%; }
  label.opt { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; margin-right: 10px; }
  label.opt.off { color: var(--ink-3); cursor: not-allowed; }
  .foot2 { display: flex; gap: 8px; margin-top: 14px; } .foot2 .btn { flex: 1; }
  .unp { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 12.5px; background: var(--surface); }
  .unp[draggable="true"] { cursor: grab; }
  .unp.focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .unp .nm { flex: 1; min-width: 0; }
  .unp .nm small { display: block; color: var(--ink-3); font-size: 11px; }
  .iconbox { width: 64px; height: 64px; border: 1px solid var(--line-2); border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; background: var(--surface-2); position: relative; flex: none; }
  .iconbox .x { position: absolute; top: -8px; right: -8px; width: 18px; height: 18px; border-radius: 50%; border: 0; background: var(--ink-2); color: var(--surface); font-size: 11px; cursor: pointer; }
  .segs { display: inline-flex; gap: 4px; }
  .seg { border: 1px solid var(--line-2); background: var(--surface); padding: 4px 10px; font-size: 11.5px; font-weight: 600; border-radius: 999px; cursor: pointer; color: var(--ink-2); }
  .seg.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .fo { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface-2); font-size: 12.5px; }
  .fo .d1 { font-weight: 800; margin: 12px 0 4px; font-size: 13px; } .fo .d1:first-child { margin-top: 0; }
  .fo .d1 .ico { color: var(--accent); margin-right: 6px; }
  .fo .g { font-weight: 700; margin: 6px 0 2px; }
  .fo .i { padding: 3px 0; }
  .fo .i .u { color: var(--ink-3); font-size: 11px; margin-left: 8px; font-family: var(--f-mono); }
  .fo .gone { margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--line-2); color: var(--warn); font-size: 12px; }
  .tag.sm { padding: 0 6px; font-size: 10.5px; }
  .mbar { position: sticky; bottom: env(safe-area-inset-bottom, 0px); display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; background: var(--surface); border-top: 1px solid var(--line); padding: 14px 18px; margin: 20px -36px -36px; box-shadow: 0 -8px 24px rgba(20,24,40,.06); font-weight: 700; border-radius: 0 0 16px 16px; }
  .mbar .btn { min-width: 84px; padding: 9px 16px; font-size: 13px; }
  .mfoot { display: flex; align-items: center; justify-content: flex-end; gap: 16px; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
  .mfoot b { color: var(--ink); margin-left: 4px; }

  /* 상세 · 폼 (A·B안 동일 구성) */
  .sect { margin-bottom: 26px; }
  .sect h2 { font-size: 14px; font-weight: 700; margin: 0 0 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sect.menu { background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 12px; padding: 14px 16px 6px; }
  .sect.menu .ftable { background: var(--surface); }
  .ftable { border-top: 1px solid var(--line); overflow-x: auto; }
  .frow { display: grid; grid-template-columns: 130px minmax(0, 1fr); border-bottom: 1px solid var(--line); min-height: 46px; }
  .frow.two { grid-template-columns: 130px minmax(0, 1fr) 130px minmax(0, 1fr); }
  @media (max-width: 760px) { .frow.two { grid-template-columns: 110px minmax(0, 1fr); } .frow { grid-template-columns: 110px minmax(0, 1fr); } }
  .frow .k { background: var(--surface-2); padding: 12px 14px; font-size: 12px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; }
  .frow .v { padding: 8px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 12.5px; min-width: 0; }
  .frow .v .block { flex-basis: 100%; }
  input.w-sm { width: 160px; } input.w-md { width: 280px; } input.w-lg { width: 420px; }
  .formactions { display: flex; justify-content: center; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
  .formactions.split { justify-content: space-between; }
  .mtable { width: 100%; border-collapse: collapse; font-size: 12px; margin: 4px 0; }
  .mtable th, .mtable td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .mtable th { background: var(--surface-2); font-weight: 600; color: var(--ink-2); }
  .ro-in { background: var(--surface-2); color: var(--ink-3); }

    function yn(name, val) { return '<label class="opt"><input type="radio" name="' + name + '" value="1"' + (val ? " checked" : "") + '> 사용</label><label class="opt"><input type="radio" name="' + name + '" value="0"' + (val ? "" : " checked") + "> 사용안함</label>"; }
    function cks(attr, defs, s) { return defs.map(function (d) { return '<label class="opt"><input type="checkbox" data-' + attr + '="' + d[0] + '"' + (s.indexOf(d[0]) !== -1 ? " checked" : "") + "> " + d[1] + "</label>"; }).join(""); }
    function txt(id, v, ph) { return '<input type="text" class="w-md" id="' + id + '" value="' + esc(v) + '" placeholder="' + esc(ph) + '">'; }
    card.innerHTML = header(["페이지 개발 설정", "수정"], "페이지 개발 설정 수정 · " + p.name) +
      '<div class="sect"><h2>개발 설정</h2><div class="ftable">' +
      row("상품 프로세스 구분 관리", sel("f-proc", PROC, e.proc, 200)) +
      row2("마스킹/업무인증<br>동시적용 여부", '<label class="opt"><input type="radio" name="f-dual" value="0"' + (e.dualAuth ? "" : " checked") + '> 아니오</label><label class="opt"><input type="radio" name="f-dual" value="1"' + (e.dualAuth ? " checked" : "") + "> 예</label>", "접근중단일시", '<input type="date" id="f-bfrom" value="' + esc(e.blockFrom) + '"> - <input type="date" id="f-bto" value="' + esc(e.blockTo) + '">') +
      row2("모바일 Web JOB 코드", txt("f-mjob", e.mwebJob, "모바일 Web JOB 코드를 입력해주세요."), "App JOB 코드", txt("f-ajob", e.appJob, "App JOB 코드를 입력해주세요.")) +
      row2("가이드 URL", txt("f-gurl", e.guideUrl, "가이드 URL을 입력해주세요."), "차단화면 URL", txt("f-burl", e.blockUrl, "기본페이지: /common/util/service-block")) +
      row2("최종 수정자", '<input type="text" class="w-md ro-in" value="김혜윤(P217326)" readonly>', "최종 수정일시", '<input type="text" class="w-md ro-in" value="' + esc(p.updated) + '" readonly>') + "</div></div>" +
      '<div class="sect"><h2>관리성 정보 <span class="hint" style="font-weight:400">엑셀 대체 관리용 · 메뉴 노출 검증 없음</span></h2><div class="ftable">' +
      row2("페이지 속성", Object.keys(ATTR).map(function (a) { return '<label class="opt"><input type="radio" name="f-attr" value="' + a + '"' + (e.attr === a ? " checked" : "") + "> " + ATTR[a] + "</label>"; }).join(""), "화면 제공형태", FORMS.map(function (a) { return '<label class="opt"><input type="radio" name="f-form" value="' + a + '"' + (e.form === a ? " checked" : "") + "> " + a + "</label>"; }).join("")) +
      row("업무처리 형태", cks("biz", BIZ, e.biz)) + row2("과금 팝업 호출", cks("pop", CH, e.popCh), "네비게이션 노출", cks("nav", NAV, e.nav)) + "</div></div>" +
      '<div class="sect"><h2>운영 부가 정보</h2><div class="ftable">' + (isG ? "" : row2("검색 노출 여부", yn("f-s", e.search), "공유하기 여부", yn("f-share", e.share))) + row("비고", '<input type="text" class="w-lg" id="f-remark" value="' + esc(e.remark) + '" placeholder="페이지에 대한 비고사항을 입력해주세요.">') + "</div></div>" +
      (isG ? "" : '<div class="sect"><h2>연결 정보</h2><div class="ftable">' + row("CVM 접촉이벤트 ID", '<input type="text" class="w-md" id="f-cvm" value="' + esc(e.cvm) + '" placeholder="접촉이벤트 ID"><button class="btn sm" id="f-cvm-find">조회</button><span class="hint">사유코드: <span id="f-reason">' + esc(e.reason || "—") + "</span></span>") + "</div></div>" +
        '<div class="sect"><h2>마스킹 정보</h2><div class="ftable">' + row("마스킹 적용", yn("f-mask", e.maskOn)) + row2("해제 방식", sel("f-mway", [["","선택"],["휴대폰 인증","휴대폰 인증"],["비밀번호 재확인","비밀번호 재확인"]], e.maskWay, 180), "해제 인증", sel("f-mauth", [["","선택"],["PASS","PASS"],["SMS","SMS"],["간편인증","간편인증"]], e.maskAuth, 140)) + "</div></div>" +
        '<div class="sect"><h2>검색 및 태그정보</h2><div class="ftable">' + row("태그 사용여부", yn("f-tag", e.tagUse)) +
        (e.tagUse ? row("메타 태그", '<div class="tagbox" id="f-tags">' + e.tags.map(function (t, i) { return '<span class="tg">' + esc(t) + ' <b data-rm="' + i + '">×</b></span>'; }).join("") + '<button class="btn sm" id="f-tag-add">+</button><input type="text" class="w-sm" id="f-tag-in" placeholder="태그 입력 후 Enter" style="display:none"></div>') : "") +
        row("메타 태그 설정", '<div class="block tblwrap"><table class="mtable"><tr><th style="width:140px">keywords</th><td><input type="text" class="w-lg" id="f-kw" value="' + esc(e.keywords) + '" placeholder="쉼표로 구분"></td></tr><tr><th>og:title</th><td><input type="text" class="w-lg" id="f-ogt" value="' + esc(e.ogTitle) + '" placeholder="' + esc(p.name) + '"></td></tr><tr><th>og:description</th><td><input type="text" class="w-lg" id="f-ogd" value="' + esc(e.ogDesc) + '"></td></tr></table></div>') + "</div></div>") +
      '<div class="formactions"><button class="btn" id="b-cancel">취소</button><button class="btn primary" id="b-save">저장</button></div>';
    function vals(a) { return Array.prototype.map.call(card.querySelectorAll("[data-" + a + "]:checked"), function (c) { return c.getAttribute("data-" + a); }); }
    function collect() {
      e.proc = card.querySelector("#f-proc").value; e.dualAuth = card.querySelector('input[name="f-dual"]:checked').value === "1";
      e.blockFrom = card.querySelector("#f-bfrom").value; e.blockTo = card.querySelector("#f-bto").value;
      e.mwebJob = card.querySelector("#f-mjob").value.trim(); e.appJob = card.querySelector("#f-ajob").value.trim(); e.guideUrl = card.querySelector("#f-gurl").value.trim(); e.blockUrl = card.querySelector("#f-burl").value.trim();
      var at = card.querySelector('input[name="f-attr"]:checked'); if (at) e.attr = at.value; var fm = card.querySelector('input[name="f-form"]:checked'); if (fm) e.form = fm.value;
      e.biz = vals("biz"); e.popCh = vals("pop"); e.nav = vals("nav");
      var sx = card.querySelector('input[name="f-s"]:checked'); if (sx) e.search = sx.value === "1"; var sh = card.querySelector('input[name="f-share"]:checked'); if (sh) e.share = sh.value === "1";
      e.remark = card.querySelector("#f-remark").value;
      var cv = card.querySelector("#f-cvm"); if (cv) { e.cvm = cv.value.trim(); e.reason = card.querySelector("#f-reason").textContent.replace(/^—$/, ""); }
      var mk = card.querySelector('input[name="f-mask"]:checked'); if (mk) { e.maskOn = mk.value === "1"; e.maskWay = card.querySelector("#f-mway").value; e.maskAuth = card.querySelector("#f-mauth").value; }
      var tg = card.querySelector('input[name="f-tag"]:checked'); if (tg) e.tagUse = tg.value === "1";
      var kw = card.querySelector("#f-kw"); if (kw) { e.keywords = kw.value.trim(); e.ogTitle = card.querySelector("#f-ogt").value.trim(); e.ogDesc = card.querySelector("#f-ogd").value.trim(); }
    }
    card.querySelectorAll('input[name="f-tag"]').forEach(function (r) { r.onchange = function () { collect(); renderDevEdit(); }; });
    var cf = card.querySelector("#f-cvm-find"); if (cf) cf.onclick = function () { var id = card.querySelector("#f-cvm").value.trim(); if (!id) { toast("접촉이벤트 ID를 입력해 주세요"); return; } card.querySelector("#f-reason").textContent = CVM_REASON[id] || "RS" + id.replace(/\D/g, "").slice(-4) + " · (조회 결과)"; };
    var tb = card.querySelector("#f-tags"); if (tb) {
      tb.querySelectorAll("[data-rm]").forEach(function (b) { b.onclick = function () { collect(); e.tags.splice(+b.getAttribute("data-rm"), 1); renderDevEdit(); }; });
      var ti = card.querySelector("#f-tag-in"); card.querySelector("#f-tag-add").onclick = function () { ti.style.display = ""; ti.focus(); };
      ti.onkeydown = function (ev) { if (ev.key === "Enter") { var v = ti.value.trim(); if (v) { collect(); if (e.tags.indexOf(v) === -1) e.tags.push(v); renderDevEdit(); } } };
    }
    card.querySelector("#b-cancel").onclick = function () { editing = null; view = "devd"; render(); };
    card.querySelector("#b-save").onclick = function () {
      collect(); if (e.blockFrom && e.blockTo && e.blockFrom > e.blockTo) { toast("접근중단일시 시작이 종료보다 늦습니다"); return; } DF.forEach(function (k) { p[k] = clone(e[k]); }); p.updated = now(); p.drej = false;
      var pr = pendingDev(p); if (pr) { pr.status = "rejected"; pr.why = "요청 후 수정되어 자동 취소"; pr.dby = "시스템"; pr.dat = now(); }
      editing = null; view = "devd"; render(); toast(pr ? "승인 대기 중 수정 — " + pr.no + " 요청이 취소되었습니다" : "저장되었습니다 (작성본) — 승인 요청하세요");
    };
  }

  /* ============================================================ 빌더 연동 시뮬레이션 · 노출 예약 */
  function builderApproved(p) {
    p.ctState = "approved";
    var live = p.tlive && p.tlive.menuOn && p.tlive.url;
    if (live) REQS.push({ no: "BL-" + stamp() + "-" + String(++reqSeq).padStart(2, "0"), kind: "builder", title: p.name + " · 빌더 화면 승인 → 노출 예약 해제", by: "화면 빌더", at: now(), status: "auto", dby: "시스템", dat: now(), note: "운영 정보 승인으로 노출 예약된 페이지라 추가 승인 없이 FO에 반영됐습니다.",
      items: [{ id: p.id, name: p.name, ch: [{ l: "FO 노출", from: "노출 예약", to: "노출" }, { l: "빌더 화면", from: p.ct + " 승인 전", to: p.ct + " 승인" }] }] });
    return live;
  }
  function openSim() {
    var bs = pages.filter(function (p) { return p.ptype === "builder" && !p.del; });
    var cand = bs.filter(function (p) { return !p.ct; }), conn = bs.filter(function (p) { return p.ct; }), wait = conn.filter(function (p) { return p.ctState !== "approved"; });
    function opts(list, fn) { return list.length ? list.map(function (p) { return '<option value="' + p.id + '">' + esc(fn(p)) + "</option>"; }).join("") : '<option value="">해당 없음</option>'; }
    showModal({ cls: "wide", title: "빌더 연동 시뮬레이션", okText: "닫기", noCancel: true, html:
      '<p>화면 빌더에서 일어나는 동작을 흉내 냅니다. 빌더는 URL·메타태그를 입력하지 않고, 전체 페이지에 등록된 「빌더 화면」 유형 페이지를 불러와 1:1로 연결합니다.</p>' +
      '<div class="simsec"><h4>① 빌더에서 페이지 불러오기</h4><div class="r"><select id="sim-pick" style="width:300px">' + opts(cand, function (p) { return p.id + " · " + p.name + (p.tlive ? "" : " (운영 정보 승인 전)"); }) + '</select><button class="btn sm primary" id="sim-link"' + (cand.length ? "" : " disabled") + ">불러와 연결</button></div></div>" +
      '<div class="simsec"><h4>② 빌더 화면 승인</h4><div class="r"><select id="sim-ap" style="width:300px">' + opts(wait, function (p) { return p.ct + " · " + p.name + (p.tlive && p.tlive.menuOn ? " (노출 예약 중)" : ""); }) + '</select><button class="btn sm" id="sim-apgo"' + (wait.length ? "" : " disabled") + '>화면 승인</button></div><div class="hint">노출 예약 중이면 승인 즉시 FO에 나타나고 이력에 「빌더 연동 · 자동」으로 남습니다</div></div>' +
      '<div class="simsec"><h4>③ 빌더 화면 삭제 (연결 해제)</h4><div class="r"><select id="sim-del" style="width:300px">' + opts(conn, function (p) { return p.ct + " · " + p.name + (shownIds("live")[p.id] ? " (FO 노출 중)" : ""); }) + '</select><button class="btn sm warnb" id="sim-delgo"' + (conn.length ? "" : " disabled") + '>빌더에서 삭제</button></div><div class="hint">페이지는 남고 연결만 해제 · FO에 노출 중인 화면은 삭제 불가</div></div>',
      bind: function (root) {
        root.querySelector("#sim-link").onclick = function () { var p = byId(root.querySelector("#sim-pick").value); if (!p) return; ctSeq += 1; p.ct = "CT-00" + ctSeq; p.ctState = "pending"; closeModal(); toast(p.ct + " ↔ " + p.id + " 연결 · 화면 승인 전"); render(); };
        root.querySelector("#sim-apgo").onclick = function () { var p = byId(root.querySelector("#sim-ap").value); if (!p) return; var live = builderApproved(p); closeModal(); toast(p.ct + " 화면 승인" + (live ? " — 노출 예약 해제 · FO에 자동 노출" : "")); render(); };
        root.querySelector("#sim-delgo").onclick = function () { var p = byId(root.querySelector("#sim-del").value); if (!p) return; if (shownIds("live")[p.id]) { toast("「" + p.name + "」은 FO에 노출 중이라 화면을 삭제할 수 없습니다 — 운영 정보에서 미노출 승인 후 삭제"); return; } var ct = p.ct; p.ct = ""; p.ctState = ""; closeModal(); toast(ct + " 삭제 → " + p.id + " 연결 해제 (페이지 유지)"); render(); };
      } });
  }
  /* 시나리오 가이드 — 빌더 노출 예약 예외 케이스 */
  /* 시나리오 가이드 — 빌더 노출 예약 */
  function openScn() {
    var hb = byId("PG000305"), sh = byId("PG000230"), shown = shownIds("live");
    var st = [
      { t: "「혜택 홈」 확인 — 운영 정보 승인은 끝났지만 빌더 미연결", s: "Front 노출이 켜진 채 승인돼 「노출 예약 · 빌더 미연결」입니다. [FO 미리보기]의 현재 FO에는 없고 「노출 예약」 줄에만 보입니다.", done: false, btn: "운영 정보에서 보기", run: function () { goOps("PG000305"); } },
      { t: "빌더에서 「혜택 홈」을 불러와 연결", s: "빌더 화면 CT가 연결되고 「노출 예약 · 빌더 화면 승인 전」으로 바뀝니다. 아직 FO에는 없습니다.", done: !!(hb && hb.ct), btn: "실행", run: function () { if (hb && !hb.ct) { ctSeq += 1; hb.ct = "CT-00" + ctSeq; hb.ctState = "pending"; } goOps("PG000305"); toast("빌더 연결 · " + hb.ct); } },
      { t: "빌더 화면 승인 → FO 자동 노출", s: "추가 승인 없이 현재 FO에 「혜택 홈」이 나타나고, 변경/승인 이력에 「빌더 연동 · 자동」이 남습니다.", done: !!(hb && shown[hb.id]), btn: "실행", run: function () { if (hb && !hb.ct) { toast("2단계를 먼저 실행하세요"); return; } if (hb.ctState !== "approved") builderApproved(hb); goOps("PG000305"); toast("빌더 화면 승인 — 혜택 홈 FO 노출"); } },
      { t: "같은 경우 · 「쇼핑 홈」은 연결됐지만 화면 승인 전", s: "상품서비스 아래 노출 예약 상태입니다. 왼쪽 [빌더 연동 시뮬레이션] ②로 승인하면 같은 방식으로 자동 노출됩니다.", done: !!(sh && shown[sh.id]), btn: "운영 정보에서 보기", run: function () { goOps("PG000230"); } },
      { t: "새 빌더 페이지를 노출 켠 채 추가해 보기", s: "[수정] → 「혜택 > 혜택」 선택 → [+ 하위 페이지 추가] (유형: 빌더 화면, URL 입력) → Front 노출 켬 → 임시저장 → 승인 요청 → 이력에서 승인. 승인 후 「노출 예약」으로 반영되고, 빌더 연결·승인 시 자동 노출됩니다.", done: false, btn: "수정 열기", run: function () { goOps("PG000320", true); } }
    ];
    showModal({ cls: "wide", title: "시나리오 · 빌더 노출 예약", okText: "닫기", noCancel: true, html:
      '<p><b>규칙</b> — 빌더 화면 유형은 Front 노출을 켠 채로 운영 정보 승인을 받을 수 있습니다. 빌더 화면이 연결·승인되기 전까지는 「노출 예약」으로 남고, 빌더 화면이 승인되는 순간 추가 승인 없이 FO에 나타납니다. 다른 유형은 운영 정보 승인 즉시 노출됩니다.</p>' +
      '<ol class="steps">' + st.map(function (x, i) { return '<li class="' + (x.done ? "done" : "") + '"><span class="n">' + (x.done ? "✓" : i + 1) + "</span><div><b>" + esc(x.t) + "</b><small>" + esc(x.s) + '</small></div><button class="btn sm" data-st="' + i + '">' + esc(x.btn) + "</button></li>"; }).join("") + "</ol>",
      bind: function (root) { root.querySelectorAll("[data-st]").forEach(function (b) { b.onclick = function () { var x = st[+b.getAttribute("data-st")]; closeModal(); x.run(); }; }); } });
  }
  document.addEventListener("click", function (e) { if (e.target.closest("[data-sim]")) guardLeave(openSim); else if (e.target.closest("[data-scn]")) guardLeave(openScn); });

  /* ============================================================ 라우팅 */
  function render() {
    if (!O.focus) window.scrollTo(0, 0);
    var grp = (view === "dev" || view === "devd" || view === "devedit") ? "dev" : "ops";
    document.querySelectorAll(".lnb [data-nav]").forEach(function (a) { a.classList.toggle("on", a.getAttribute("data-nav") === grp); });
    if (view === "dev") renderDevList(); else if (view === "devd") renderDevDetail(); else if (view === "devedit") renderDevEdit(); else if (view === "hist") renderHist(); else renderOps();
  }
  document.querySelectorAll(".lnb [data-nav]").forEach(function (a) { a.onclick = function () { var v = a.getAttribute("data-nav"); guardLeave(function () { view = v; render(); }); }; });
  window.__dbg = { byId: byId, shownIds: shownIds, REQS: REQS };
  // 어드민 LNB가 해시를 바꾸면(또는 새 iframe src) 상위 뷰 전환. 상세(devd/devedit)·이력은 내부 전환 유지.
  window.addEventListener("hashchange", function () { var v = location.hash === "#dev" ? "dev" : "ops"; guardLeave(function () { view = v; render(); }); });
  render();
})();
</script>
</body>
