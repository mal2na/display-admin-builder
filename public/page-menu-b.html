      function apply() { ["ptype","name","url","use","channels","search","remark","attr","form","auths","share","biz","popCh","nav","lines","cvm","reason","tagUse","tags","keywords","ogTitle","ogDesc"].forEach(function (k) { orig[k] = e[k]; }); var msg; if (e.parent !== orig.parent) { var r = movePage(orig, e.parent); if (!r.ok) { toast(r.msg); return; } msg = r.msg; } afterEdit(orig); editing = null; goDetail(orig.id); toast(msg || "저장되었습니다 (작성본) — 승인 요청하세요"); }
      if (e.parent !== orig.parent) { var c = moveCheck(orig, e.parent); if (!c.ok) { toast(c.msg); return; } confirmMove(orig, e.parent, apply); return; }
      alertBox("저장하시겠습니까?", "입력한 내용으로 저장됩니다.", apply);
    };
  }

  function render() { renderNav(); if (view === "detail") renderDetail(); else if (view === "edit" || view === "create") renderForm(); else if (tab === "ia") renderIA(); else renderList(); window.scrollTo(0, 0); }

  /* ============================================================ LNB */
  function goMenu(id) { if (id) goDetail(id); else { view = "list"; tab = "search"; render(); } }
  function navTo(target) {
    var go = function () { view = "list"; tab = "search"; render(); };
    if ((view === "edit" || view === "create") && editing) { alertBox("작성 중인 내용이 있습니다", "이동하면 입력한 정보는 저장되지 않습니다.", function () { editing = null; go(); }); return; }
    if (target === "pages" && view === "list" && tab === "search") return;
    go();
  }
  function renderNav() { document.querySelectorAll(".lnb [data-nav]").forEach(function (a) { a.classList.toggle("on", a.getAttribute("data-nav") === "pages"); }); }
  document.querySelectorAll(".lnb [data-nav]").forEach(function (a) { a.onclick = function () { navTo(a.getAttribute("data-nav")); }; });
  /* ============================================================ 빌더 연동 시뮬레이션 · 노출 예약 시나리오 */
  function openSim() {
    var bs = pages.filter(function (p) { return p.ptype === "builder"; });
    var cand = bs.filter(function (p) { return !p.ct; }), conn = bs.filter(function (p) { return p.ct; }), wait = conn.filter(function (p) { return p.ctState !== "approved"; });
    function opts(list, fn) { return list.length ? list.map(function (p) { return '<option value="' + p.id + '">' + esc(fn(p)) + "</option>"; }).join("") : '<option value="">해당 없음</option>'; }
    showModal({ cls: "wide", title: "빌더 연동 시뮬레이션", okText: "닫기", noCancel: true, html:
      '<p>화면 빌더에서 일어나는 동작을 흉내 냅니다. 빌더는 URL·메타태그를 입력하지 않고, 전체페이지에 등록된 「빌더 화면」 유형 페이지를 불러와 1:1로 연결합니다.</p>' +
      '<div class="simsec"><h4>① 빌더에서 페이지 불러오기</h4><div class="r"><select id="sim-pick" style="width:300px">' + opts(cand, function (p) { return p.id + " · " + p.name + (p.fixed ? "" : " (URL 확정 전)"); }) + '</select><button class="btn sm primary" id="sim-link"' + (cand.length ? "" : " disabled") + '>불러와 연결</button></div><div class="hint">유형이 「빌더 화면」이고 아직 연결되지 않은 페이지만 목록에 나옵니다</div></div>' +
      '<div class="simsec"><h4>② 빌더 화면 승인</h4><div class="r"><select id="sim-ap" style="width:300px">' + opts(wait, function (p) { return p.ct + " · " + p.name + (p.live && p.live.inMenu && p.live.menuOn ? " (노출 예약 중)" : ""); }) + '</select><button class="btn sm" id="sim-apgo"' + (wait.length ? "" : " disabled") + '>화면 승인</button></div><div class="hint">노출 예약 중이면 승인 즉시 FO에 나타납니다 (메뉴 재승인 없음)</div></div>' +
      '<div class="simsec"><h4>③ 빌더 화면 삭제 (연결 해제)</h4><div class="r"><select id="sim-del" style="width:300px">' + opts(conn, function (p) { return p.ct + " · " + p.name + (liveVisible(p) ? " (FO 노출 중)" : ""); }) + '</select><button class="btn sm" id="sim-delgo"' + (conn.length ? "" : " disabled") + '>빌더에서 삭제</button></div><div class="hint">페이지는 남고 연결만 해제 · FO에 노출 중인 화면은 삭제 불가</div></div>',
      bind: function (root) {
        root.querySelector("#sim-link").onclick = function () { var p = byId(root.querySelector("#sim-pick").value); if (!p) return; ctSeq += 1; p.ct = "CT-00" + ctSeq; p.ctState = "pending"; closeModal(); toast(p.ct + " ↔ " + p.id + " 연결 · 화면 승인 전"); render(); };
        root.querySelector("#sim-apgo").onclick = function () { var p = byId(root.querySelector("#sim-ap").value); if (!p) return; p.ctState = "approved"; closeModal(); toast(p.ct + " 화면 승인" + (liveVisible(p) ? " — 노출 예약 해제 · FO에 자동 노출" : "")); render(); };
        root.querySelector("#sim-delgo").onclick = function () { var p = byId(root.querySelector("#sim-del").value); if (!p) return; if (liveVisible(p)) { toast("「" + p.name + "」은 FO에 노출 중이라 화면을 삭제할 수 없습니다 — 미노출 승인 후 삭제"); return; } var ct = p.ct; p.ct = ""; p.ctState = ""; closeModal(); toast(ct + " 삭제 → " + p.id + " 연결 해제 (페이지 유지)"); render(); };
      } });
  }
  function openScn() {
    var hb = byId("PG000305"), sh = byId("PG000230");
    var st = [
      { t: "「혜택 홈」 확인 — 페이지·메뉴 승인은 끝났지만 빌더 미연결", s: "Front 노출이 켜진 채 승인돼 「노출 예약」 배지가 붙어 있습니다. [FO 미리보기]에는 아래 「노출 예약」 줄에만 보입니다.", done: false, btn: "상세 보기", run: function () { goMenu("PG000305"); } },
      { t: "빌더에서 「혜택 홈」을 불러와 연결", s: "빌더 화면 CT가 연결되고 「화면 승인 전」으로 바뀝니다. 아직 FO에는 없습니다.", done: !!hb.ct, btn: "실행", run: function () { if (!hb.ct) { ctSeq += 1; hb.ct = "CT-00" + ctSeq; hb.ctState = "pending"; } goMenu("PG000305"); toast("빌더 연결 · " + hb.ct); } },
      { t: "빌더 화면 승인 → FO 자동 노출", s: "메뉴 재승인 없이 FO에 「혜택 홈」이 나타납니다. [FO 미리보기]로 확인하세요.", done: liveVisible(hb), btn: "실행", run: function () { if (!hb.ct) { toast("2단계를 먼저 실행하세요"); return; } hb.ctState = "approved"; goMenu("PG000305"); toast("빌더 화면 승인 — 혜택 홈 FO 노출"); } },
      { t: "같은 경우 · 「쇼핑 홈」은 연결됐지만 화면 승인 전", s: "상품서비스 아래 노출 예약 상태입니다. [빌더 연동 시뮬레이션] ②로 승인하면 같은 방식으로 자동 노출됩니다.", done: liveVisible(sh), btn: "상세 보기", run: function () { goMenu("PG000230"); } },
      { t: "새 빌더 페이지 등록부터 해 보기 — 「가을 이벤트」", s: "전체페이지 상세에서 [URL 확정] → [승인 요청] → 승인. 빌더 미연결이라 노출 예약으로 남고, 시뮬레이션에서 연결·승인하면 자동 노출됩니다.", done: liveVisible(byId("PG000510")), btn: "상세 열기", run: function () { goDetail("PG000510"); } }
    ];
    showModal({ cls: "wide", title: "시나리오 · 빌더 노출 예약", okText: "닫기", noCancel: true, html:
      '<p><b>규칙</b> — 빌더 화면 유형은 빌더 화면이 승인되기 전에도 페이지 승인과 메뉴 등록·노출 승인을 받을 수 있습니다. 그동안은 「노출 예약」으로 남고, 빌더 화면이 승인되는 순간 추가 승인 없이 FO에 나타납니다.</p>' +
      '<ol class="steps">' + st.map(function (x, i) { return '<li class="' + (x.done ? "done" : "") + '"><span class="n">' + (x.done ? "✓" : i + 1) + "</span><div><b>" + esc(x.t) + "</b><small>" + esc(x.s) + '</small></div><button class="btn sm" data-st="' + i + '">' + esc(x.btn) + "</button></li>"; }).join("") + "</ol>",
      bind: function (root) { root.querySelectorAll("[data-st]").forEach(function (b) { b.onclick = function () { var x = st[+b.getAttribute("data-st")]; closeModal(); x.run(); }; }); } });
  }
  document.addEventListener("click", function (e) { if (e.target.closest("[data-sim]")) openSim(); else if (e.target.closest("[data-scn]")) openScn(); });
  window.__dbg = { goDetail: goDetail, byId: byId, P: P, foText: foText, goMenu: goMenu, create: function () { view = "create"; editing = P({ id: "PG000600", name: "" }); render(); } };
  render();
})();
</script>
</body>
