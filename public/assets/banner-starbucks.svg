<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 324" width="672" height="324" role="img" aria-label="T 우주 스타벅스 옵션 출시">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FE7BA"/>
      <stop offset="1" stop-color="#7FE0AE"/>
    </linearGradient>
  </defs>
  <rect width="672" height="324" fill="url(#bg)"/>

  <!-- 좌측 텍스트 -->
  <text x="44" y="112" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#2C3A32">T 우주 스타벅스 옵션 출시</text>
  <text x="44" y="162" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="30" font-weight="800" fill="#0F1E16">T우주로 콘텐츠 즐기고</text>
  <text x="44" y="204" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="30" font-weight="800" fill="#0F1E16">스타벅스 20% 할인혜택 받기</text>

  <!-- 우측 앱 아이콘 클러스터 -->
  <!-- TVING (빨강) -->
  <g>
    <rect x="438" y="66" width="60" height="60" rx="16" fill="#E8122E"/>
    <path d="M438 82 q0-16 16-16 h20 z" fill="#1A1A1A"/>
    <text x="468" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#fff">TV</text>
  </g>

  <!-- YouTube (흰색+빨강 플레이) -->
  <g>
    <rect x="446" y="150" width="58" height="58" rx="16" fill="#FFFFFF"/>
    <rect x="461" y="167" width="28" height="24" rx="7" fill="#FF0000"/>
    <path d="M472 173 l9 6 l-9 6 z" fill="#fff"/>
  </g>

  <!-- Disney+ (네이비) -->
  <g>
    <rect x="500" y="230" width="96" height="48" rx="12" fill="#0A1A44"/>
    <text x="548" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-style="italic" font-weight="700" fill="#fff">Disney+</text>
  </g>

  <!-- Starbucks (그린 원형 사이렌) -->
  <g>
    <circle cx="572" cy="144" r="56" fill="#00693E"/>
    <circle cx="572" cy="144" r="56" fill="none" stroke="#0F1E16" stroke-width="3" opacity="0.15"/>
    <circle cx="572" cy="144" r="40" fill="none" stroke="#fff" stroke-width="4"/>
    <g fill="#fff">
      <circle cx="572" cy="132" r="12"/>
      <path d="M556 150 q16 22 32 0 q-16 10 -32 0 z"/>
      <path d="M572 122 l3 8 l8 1 l-6 6 l2 8 l-7 -4 l-7 4 l2 -8 l-6 -6 l8 -1 z"/>
    </g>
  </g>
</svg>
